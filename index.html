<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ColorCraft Studio</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<!-- Lucide Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap');
body {
font-family: 'Tajawal', sans-serif;
}
.color-card:hover .color-actions {
opacity: 1;
}
</style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

<!-- Navigation Header -->
<header class="border-b border-slate-800 bg-slate-950/80 backdrop-blur sticky top-0 z-50">
<div class="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center">
<div class="flex items-center gap-3">
<div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-pink-500 flex items-center justify-center shadow-lg shadow-indigo-500/20">
<i data-lucide="palette" class="w-5 h-5 text-white"></i>
</div>
<h1 class="text-xl font-bold bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">
ColorCraft Studio
</h1>
</div>

<!-- Auth Status & Actions -->
<div class="flex items-center gap-3">
<div id="userInfo" class="hidden flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700">
<img id="userAvatar" class="w-6 h-6 rounded-full" src="" alt="User Avatar">
<span id="userName" class="text-sm font-medium text-slate-300"></span>
</div>
<button id="loginBtn" onclick="toggleAuth()" class="flex items-center gap-2 bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2 rounded-xl text-sm font-medium transition shadow-lg shadow-indigo-600/20">
<i data-lucide="log-in" class="w-4 h-4"></i>
<span id="loginText">تسجيل الدخول</span>
</button>
</div>
</div>
</header>

<!-- Main Content -->
<main class="max-w-7xl mx-auto px-4 py-8 flex-1 w-full space-y-8">

<!-- Controls Section -->
<section class="bg-slate-800/50 border border-slate-700/50 p-6 rounded-2xl shadow-xl space-y-6 backdrop-blur">
<div class="flex flex-wrap items-center justify-between gap-4">
<div class="flex flex-wrap items-center gap-3">
<label class="text-sm text-slate-400 font-medium">نوع التناغم:</label>
<select id="harmonyType" onchange="generatePalette()" class="bg-slate-900 border border-slate-700 text-slate-200 text-sm rounded-xl px-4 py-2.5 focus:ring-2 focus:ring-indigo-500 focus:outline-none">
<option value="monochromatic">أحادي اللون (Monochromatic)</option>
<option value="analogous">متماثل (Analogous)</option>
<option value="complementary">مكمل (Complementary)</option>
<option value="triadic">ثلاثي (Triadic)</option>
</select>

<button onclick="generatePalette()" class="flex items-center gap-2 bg-slate-700 hover:bg-slate-600 text-slate-200 px-4 py-2.5 rounded-xl text-sm font-medium transition">
<i data-lucide="refresh-cw" class="w-4 h-4"></i>
توليد ألوان جديدة
</button>
</div>

<div class="flex items-center gap-3">
<input type="file" id="imageInput" accept="image/*" class="hidden" onchange="extractColorsFromImage(event)">
<button onclick="document.getElementById('imageInput').click()" class="flex items-center gap-2 bg-slate-800 border border-slate-700 hover:bg-slate-700 text-slate-200 px-4 py-2.5 rounded-xl text-sm font-medium transition">
<i data-lucide="image" class="w-4 h-4"></i>
استخراج من صورة
</button>
<button onclick="saveCurrentPalette()" class="flex items-center gap-2 bg-pink-600 hover:bg-pink-500 text-white px-4 py-2.5 rounded-xl text-sm font-medium transition shadow-lg shadow-pink-600/20">
<i data-lucide="bookmark" class="w-4 h-4"></i>
حفظ الباليتة
</button>
</div>
</div>

<!-- Active Palette Display -->
<div id="paletteDisplay" class="grid grid-cols-2 md:grid-cols-5 gap-4 h-64 md:h-80 rounded-xl overflow-hidden p-2 bg-slate-900/50 border border-slate-800">
<!-- Color Cards inserted dynamically -->
</div>
</section>

<!-- Saved Palettes Section -->
<section class="space-y-4">
<div class="flex items-center justify-between">
<h2 class="text-xl font-bold flex items-center gap-2 text-slate-200">
<i data-lucide="folder-heart" class="w-5 h-5 text-pink-500"></i>
الباليتات المحفوظة
</h2>
<span id="savedCount" class="text-xs bg-slate-800 text-slate-400 px-3 py-1 rounded-full border border-slate-700">0 باليتات</span>
</div>

<div id="savedPalettesContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
<!-- Saved items rendered here -->
</div>
</section>
</main>

<!-- Firebase SDKs -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, addDoc, getDocs, query, where, deleteDoc, doc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

// Your Firebase Configuration
const firebaseConfig = {
apiKey: "AIzaSyAQnRpsdx7-YMFrEMwVew8fFA3Vj4ciDzk",
authDomain: "colorcraft-studio-aa86c.firebaseapp.com",
projectId: "colorcraft-studio-aa86c",
storageBucket: "colorcraft-studio-aa86c.firebasestorage.app",
messagingSenderId: "614106044664",
appId: "1:614106044664:web:c1bd27409e561fd683430d",
measurementId: "G-MFS7P2J5QC"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const provider = new GoogleAuthProvider();

let currentUser = null;
let currentPalette = [];

// App Initialization
window.addEventListener('DOMContentLoaded', () => {
lucide.createIcons();
generatePalette();

onAuthStateChanged(auth, (user) => {
currentUser = user;
updateAuthUI(user);
loadSavedPalettes();
});
});

// Authentication Functions
window.toggleAuth = async () => {
if (currentUser) {
await signOut(auth);
} else {
try {
await signInWithPopup(auth, provider);
} catch (error) {
console.error("خطأ في تسجيل الدخول:", error);
}
}
};

function updateAuthUI(user) {
const loginBtn = document.getElementById('loginBtn');
const loginText = document.getElementById('loginText');
const userInfo = document.getElementById('userInfo');
const userAvatar = document.getElementById('userAvatar');
const userName = document.getElementById('userName');

if (user) {
userAvatar.src = user.photoURL || '';
userName.textContent = user.displayName || 'مستخدم';
userInfo.classList.remove('hidden');
loginText.textContent = 'تسجيل الخروج';
loginBtn.classList.replace('bg-indigo-600', 'bg-slate-700');
loginBtn.classList.replace('hover:bg-indigo-500', 'hover:bg-slate-600');
} else {
userInfo.classList.add('hidden');
loginText.textContent = 'تسجيل الدخول';
loginBtn.classList.replace('bg-slate-700', 'bg-indigo-600');
loginBtn.classList.replace('hover:bg-slate-600', 'hover:bg-indigo-500');
}
}

// Color Generation Algorithms
window.generatePalette = () => {
const type = document.getElementById('harmonyType').value;
const baseHue = Math.floor(Math.random() * 360);
currentPalette = [];

for (let i = 0; i < 5; i++) {
let h = baseHue;
let s = 65 + Math.random() * 20;
let l = 30 + (i * 12);

if (type === 'analogous') h = (baseHue + (i * 15)) % 360;
if (type === 'complementary') h = (i % 2 === 0) ? baseHue : (baseHue + 180) % 360;
if (type === 'triadic') h = (baseHue + (i * 120)) % 360;

currentPalette.push(hslToHex(h, s, l));
}
renderPaletteDisplay();
};

function renderPaletteDisplay() {
const container = document.getElementById('paletteDisplay');
container.innerHTML = currentPalette.map((hex) => &lt;div class="color-card relative group rounded-lg transition-all duration-300 flex flex-col justify-end p-4 cursor-pointer" style="background-color: ${hex}" onclick="copyColor('${hex}')"&gt; &lt;div class="color-actions opacity-0 group-hover:opacity-100 transition-opacity bg-slate-950/80 backdrop-blur p-2 rounded-lg text-center"&gt; &lt;span class="font-mono text-xs font-bold text-slate-200 block"&gt;${hex}</span>
<span class="text-[10px] text-slate-400">اضغط للنسخ</span>
</div>
</div>
`).join('');
lucide.createIcons();
}

window.copyColor = (hex) => {
navigator.clipboard.writeText(hex);
alert(تم نسخ اللون:${hex}`);
};

// Image Extraction Placeholder
window.extractColorsFromImage = (event) => {
const file = event.target.files[0];
if (!file) return;
const reader = new FileReader();
reader.onload = () => {
generatePalette(); // Generates a clean new complementary palette for demonstration
};
reader.readAsDataURL(file);
};

// Palette Storage Logic
window.saveCurrentPalette = async () => {
const paletteData = {
colors: currentPalette,
createdAt: new Date().toISOString(),
userId: currentUser ? currentUser.uid : 'local'
};

if (currentUser) {
try {
await addDoc(collection(db, "palettes"), paletteData);
loadSavedPalettes();
} catch (e) {
console.error("Error saving to cloud:", e);
}
} else {
let local = JSON.parse(localStorage.getItem('colorcraft_palettes') || '[]');
local.unshift(paletteData);
localStorage.setItem('colorcraft_palettes', JSON.stringify(local));
loadSavedPalettes();
}
};

async function loadSavedPalettes() {
const container = document.getElementById('savedPalettesContainer');
let palettes = [];

if (currentUser) {
try {
const q = query(collection(db, "palettes"), where("userId", "==", currentUser.uid));
const querySnapshot = await getDocs(q);
querySnapshot.forEach((docSnap) => {
palettes.push({ id: docSnap.id, ...docSnap.data() });
});
} catch (e) {
console.error("Error loading cloud palettes:", e);
}
} else {
palettes = JSON.parse(localStorage.getItem('colorcraft_palettes') || '[]');
}

document.getElementById('savedCount').textContent = ${palettes.length} باليتات`;

if (palettes.length === 0) {
container.innerHTML = <p class="text-slate-500 text-sm col-span-full text-center py-8"&gt;لا توجد باليتات محفوظة حتى الآن.&lt;/p>;
return;
}

container.innerHTML = palettes.map((item, idx) => &lt;div class="bg-slate-800/40 border border-slate-700/50 p-4 rounded-xl space-y-3"&gt; &lt;div class="flex h-12 rounded-lg overflow-hidden border border-slate-700"&gt;${item.colors.map(c => <div class="flex-1" style="background-color: ${c}"></div>).join('')} &lt;/div&gt; &lt;div class="flex justify-between items-center text-xs text-slate-400"&gt; &lt;span&gt;${new Date(item.createdAt).toLocaleDateString('ar-SA')}</span>
<button onclick="deletePalette('${item.id || idx}')" class="text-red-400 hover:text-red-300"&gt;حذف&lt;/button&gt; &lt;/div&gt; &lt;/div&gt;).join('');
}

window.deletePalette = async (id) => {
if (currentUser && typeof id === 'string' && id.length > 5) {
await deleteDoc(doc(db, "palettes", id));
} else {
let local = JSON.parse(localStorage.getItem('colorcraft_palettes') || '[]');
local.splice(id, 1);
localStorage.setItem('colorcraft_palettes', JSON.stringify(local));
}
loadSavedPalettes();
};

// HSL to HEX Utility
function hslToHex(h, s, l) {
l /= 100;
const a = s * Math.min(l, 1 - l) / 100;
const f = n => {
const k = (n + h / 30) % 12;
const color = l - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
return Math.round(255 * color).toString(16).padStart(2, '0');
};
return #${f(0)}

{f(4)}`;
}
</script>
</body>
</html>
